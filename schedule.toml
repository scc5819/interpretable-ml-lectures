# Single source of truth for the module/seminar board in README.md.
# Edit this file (never the README table) and run: python3 tools/render_board.py
#
# Chapter numbers and titles follow Molnar's Interpretable Machine Learning.
# Chapter 33 (Story Time) is omitted: skipped in the course, and an essay.
# Module existence is inferred from the filesystem (modules/<chapter>-*/),
# so there is no status field to maintain here.
# Presenters are display names only — no e-mails, no GitHub handles; a handle
# field may be added later once people join GitHub.
#
# Seminars follow the course calendar, not chapter order: chapter 16 (Anchors)
# is presented 2026-09-14, after chapters 17-18 (2026-08-31). The board sorts
# by chapter, so its Seminar column is deliberately non-monotonic there.

