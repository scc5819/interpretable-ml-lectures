# Labels as config: applies .github/labels.toml on merge. Idempotent and
# non-destructive — creates or updates the listed labels, never deletes.
name: Labels

on:
  push:
    branches: [main]
    paths: [".github/labels.toml"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply labels.toml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF' > labels.sh
          import shlex
          import tomllib

          with open(".github/labels.toml", "rb") as f:
              data = tomllib.load(f)
          for lb in data["labels"]:
              print(
                  "gh label create --force"
                  f" {shlex.quote(lb['name'])}"
                  f" --color {shlex.quote(lb['color'])}"
                  f" --description {shlex.quote(lb['description'])}"
              )
          EOF
          bash -ex labels.sh
